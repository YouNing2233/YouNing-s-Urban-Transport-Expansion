plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

def minecraft_version = "1.20.1"

// ── 1.20.1 依赖版本 ─────────────────────────────────────────────
rootProject.ext.fabric_loader_version = "0.19.3"
rootProject.ext.forge_version = "1.20.1-47.4.22"
rootProject.ext.fabric_api_version = "0.92.11+1.20.1"
rootProject.ext.mod_menu_version = "7.2.2"
rootProject.ext.cloth_config_fabric_version = "11.1.136"
rootProject.ext.cloth_config_forge_version = "11.1.136"
rootProject.ext.architectury_version = "9.2.14"
rootProject.ext.architectury_id = "dev.architectury"

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    // Forge 的 userdev 声明 cpw.mods:modlauncher:10.0.10，该版本只在官方 maven 上，
    // 国内镜像最高 10.0.9；两者对编译没有 API 差异，统一降级。
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "cpw.mods" && details.requested.name == "modlauncher" && details.requested.version == "10.0.10") {
                details.useVersion("10.0.9")
                details.because("10.0.10 is not mirrored domestically; 10.0.9 is API compatible for compilation")
            }
        }
    }

    // MTR jar 目录：默认本机目录，其它环境用 -PmtrJarDir=... 覆盖（CI 会传）
    def mtrJarDir = (project.findProperty("mtrJarDir") ?: "E:/Project/MTRjars").toString()
    def mtrJarPaths = { String fileName -> new File(mtrJarDir, fileName).absolutePath }

    def isForge = project.name.startsWith("forge")
    def isCommon = project.name.startsWith("common")

    project.ext.subMinecraftVersion = minecraft_version
    project.ext.subMtrJar = isForge ? mtrJarPaths("MTR-forge-1.20.1-3.6.2.2.jar") : mtrJarPaths("MTR-fabric-1.20.1-3.6.2.2.jar")
    project.ext.subFabricLoaderVersion = rootProject.fabric_loader_version
    project.ext.subFabricApiVersion = rootProject.fabric_api_version
    project.ext.subModMenuVersion = rootProject.mod_menu_version
    project.ext.subClothConfigVersion = rootProject.cloth_config_fabric_version
    project.ext.subClothConfigForgeVersion = rootProject.cloth_config_forge_version
    project.ext.subArchitecturyVersion = rootProject.architectury_version
    project.ext.subForgeVersion = rootProject.forge_version
    project.ext.subIsForge = isForge

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()

        // common 树需要 MTR + fabric-loader + architectury + cloth-config 才能编译
        // 继承 MTR 底座（三扇屏蔽门等）与跨平台注册代码
        if (isCommon) {
            modImplementation files(project.subMtrJar)
            modImplementation "net.fabricmc:fabric-loader:${project.subFabricLoaderVersion}"
            modApi "dev.architectury:architectury:${project.subArchitecturyVersion}"
            modApi("me.shedaniel.cloth:cloth-config-fabric:${project.subClothConfigVersion}") {
                exclude(group: "net.fabricmc.fabric-api")
            }
        }
    }
}

allprojects {
    apply plugin: "architectury-plugin"

    version = project.mod_version
    group = project.maven_group

    repositories {
        maven { url = "https://bmclapi2.bangbang93.com/maven/" }
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://jitpack.io/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://api.modrinth.com/maven" }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }
}
