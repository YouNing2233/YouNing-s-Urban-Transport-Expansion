name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # 1.20.1 用的 MTR 3.6.2.2 没有公开发布渠道，挂在 Tianjin 仓库的 Release 上（公开仓库，可直接下载）
  MTR_1201_BASE: https://github.com/YouNing2233/Tianjin-Metro-MTR3-Adapted-Edition/releases/download/mtr-libs-1.0.0

jobs:
  build:
    name: ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mod: fabric,          common: common,          mc: "1.20.1" }
          - { mod: forge,           common: common,          mc: "1.20.1" }
          - { mod: fabric-1.19.4,   common: common-1.19.4,   mc: "1.19.4" }
          - { mod: forge-1.19.4,    common: common-1.19.4,   mc: "1.19.4" }
          - { mod: fabric-1.19.2,   common: common-1.19.2,   mc: "1.19.2" }
          - { mod: forge-1.19.2,    common: common-1.19.2,   mc: "1.19.2" }
          - { mod: fabric-1.18.2,   common: common-1.18.2,   mc: "1.18.2" }
          - { mod: forge-1.18.2,    common: common-1.18.2,   mc: "1.18.2" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Stage MTR jars
        run: |
          set -euo pipefail
          mkdir -p mtr-jars
          cd mtr-jars
          dl() { echo "==> $2"; curl -fSL --retry 5 --retry-delay 3 -o "$2" "$1"; }

          # MTR 3.2.2-hotfix-1（Modrinth 官方 CDN，文件名与 build.gradle 完全一致）
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/KD7TXFaw/MTR-fabric-1.18.2-3.2.2-hotfix-1.jar" "MTR-fabric-1.18.2-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/aF2FI7ui/MTR-forge-1.18.2-3.2.2-hotfix-1.jar"  "MTR-forge-1.18.2-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/H0yHV2yE/MTR-fabric-1.19.2-3.2.2-hotfix-1.jar" "MTR-fabric-1.19.2-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/vkmzH7aU/MTR-forge-1.19.2-3.2.2-hotfix-1.jar"  "MTR-forge-1.19.2-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/UT2U5yfn/MTR-fabric-1.19.4-3.2.2-hotfix-1.jar" "MTR-fabric-1.19.4-3.2.2-hotfix-1.jar"
          dl "https://cdn.modrinth.com/data/XKPAmI6u/versions/PP5puu9Z/MTR-forge-1.19.4-3.2.2-hotfix-1.jar"  "MTR-forge-1.19.4-3.2.2-hotfix-1.jar"

          # MTR 3.6.2.2 for 1.20.1
          dl "${MTR_1201_BASE}/MTR-fabric-1.20.1-3.6.2.2.jar" "MTR-fabric-1.20.1-3.6.2.2.jar"
          dl "${MTR_1201_BASE}/MTR-forge-1.20.1-3.6.2.2.jar"  "MTR-forge-1.20.1-3.6.2.2.jar"

          ls -l

      - name: Narrow settings.gradle for ${{ matrix.mod }}
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = uri("https://maven.architectury.dev/") }
                  maven { url = uri("https://maven.fabricmc.net/") }
                  maven { url = uri("https://maven.minecraftforge.net/") }
              }
          }
          include("__COMMON__")
          include("__MOD__")
          rootProject.name = "USE"
          EOF
          sed -i 's/__COMMON__/${{ matrix.common }}/; s/__MOD__/${{ matrix.mod }}/' settings.gradle
          cat settings.gradle

      - name: Build
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== build attempt ${attempt} ==="
            if ./gradlew ":${MOD}:build" -PmtrJarDir="$PWD/mtr-jars" --stacktrace --console=plain; then
              echo "build ok on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed; clearing stale loom locks and retrying"
            rm -f "$HOME/.gradle/caches/fabric-loom/"*.lock 2>/dev/null || true
            rm -f "$HOME/.gradle/caches/modules-2/locks/"* 2>/dev/null || true
            sleep 20
          done
          echo "build failed after 3 attempts"
          exit 1
        env:
          MOD: ${{ matrix.mod }}

      - name: Collect jar
        run: |
          mkdir -p out
          find . -path ./mtr-jars -prune -o -type f -name "USE-*.jar" -print | grep "build/libs/" | grep -v -- "-dev-shadow" | grep -v -- "-sources" | xargs -r -I{} cp {} out/
          if [ -z "$(ls -A out)" ]; then
            echo "no jar collected, listing build/libs:"
            find . -path ./mtr-jars -prune -o -type d -name libs -print -exec ls -l {} \;
            exit 1
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.mod }}
          path: out/*.jar
          if-no-files-found: warn
